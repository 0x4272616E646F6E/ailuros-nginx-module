version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /test
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-minor-patch:
        update-types: [minor, patch]
  # The build and sanitizer Dockerfiles. (Image references inside the Go test
  # stacks are pinned by digest in code and are bumped by hand.)
  - package-ecosystem: docker
    directory: /build
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: ["*"]
