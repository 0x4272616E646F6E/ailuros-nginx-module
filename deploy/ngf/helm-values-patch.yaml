# Merge into the values of the nginx-gateway-fabric Helm release:
#   helm upgrade --install ngf oci://ghcr.io/nginx/charts/nginx-gateway-fabric \
#     --version 2.8.0 -n nginx-gateway --create-namespace \
#     -f your-values.yaml -f helm-values-patch.yaml
#
# The ConfigMap named below must exist in the namespace where NGF runs the
# NGINX pods (the Gateway's namespace) before the pods start.
nginxGateway:
  # Snippets are off by default; without this a route that lists a
  # SnippetsFilter is rejected ("extensionRef Not found").
  snippets:
    enable: true

nginx:
  patches:
    # JSONPatch, not StrategicMerge: NGF merges lists by index, so a
    # strategic patch overwrites NGF's own volumes and mounts and the
    # Deployment is rejected.
    - type: JSONPatch
      value:
        - op: add
          path: /spec/template/spec/volumes/-
          value:
            name: decision-waf-module
            configMap:
              name: decision-waf-nginx-module-ngf2.8.0
        # containers/0 must be the nginx container. Check this on every NGF
        # upgrade (see README.md).
        - op: add
          path: /spec/template/spec/containers/0/volumeMounts/-
          value:
            name: decision-waf-module
            mountPath: /usr/lib/nginx/modules/decision-waf
            readOnly: true
