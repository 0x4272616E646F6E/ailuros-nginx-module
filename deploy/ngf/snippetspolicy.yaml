# One Gateway-wide SnippetsPolicy: loads the module and defines, once per
# server, the internal location that asks decision-waf.
#
# Set before applying:
#   metadata.namespace / targetRefs.name   the Gateway's namespace and name
#   $decision_waf_upstream                 decision-waf.<namespace>.svc.cluster.local:9002
#                                          (the decision-waf Service, forward-auth port 9002)
#   resolver                               the cluster DNS Service IP
#                                          (kubectl -n kube-system get svc kube-dns)
apiVersion: gateway.nginx.org/v1alpha1
kind: SnippetsPolicy
metadata:
  name: decision-waf
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway
  snippets:
    - context: main
      value: |
        load_module /usr/lib/nginx/modules/decision-waf/ngx_http_decision_waf_module.so;

    - context: http.server
      value: |
        # decision-waf's forward-auth endpoint. Internal and answering itself: the
        # module refuses answers from non-internal or named locations and from
        # any internal redirect, and error_page does not apply here, so no
        # rewrite or try_files.
        location = /_decision_waf {
            internal;
            # Resolved per request, so an NGF reload never depends on DNS
            # (a name in proxy_pass is looked up when the config is tested,
            # and a failed lookup there leaves the Gateway unprogrammed). A
            # failed lookup here is a 502, which the module treats as no
            # decision. 10.96.0.10 is the usual kube-dns Service IP (kind,
            # kubeadm, Talos). NGINX's resolver ignores search domains, so the
            # name must be fully qualified.
            resolver 10.96.0.10 valid=10s ipv6=off;
            resolver_timeout 1s;
            set $decision_waf_upstream decision-waf.default.svc.cluster.local:9002;
            proxy_pass http://$decision_waf_upstream/;
            proxy_pass_request_body off;
            proxy_cache off;
            proxy_set_header Content-Length "";
            # The NGINX header pair, from the real request; the Traefik pair
            # is blanked so a client cannot make decision-waf see both.
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Forwarded-Method "";
            proxy_set_header X-Forwarded-Uri "";
            # The host decision-waf matches routes on and the client IP it uses,
            # from the real request: a location's own proxy_set_header lines
            # inherit none from the server, so a client's copies would pass.
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset;
            # decision-waf's classifier timeout defaults to 1s; leave 500ms.
            proxy_connect_timeout 1s;
            proxy_read_timeout 1500ms;
        }

        # Declares the variable the header below reads, so this policy is
        # valid before any route lists a filter. Never runs where
        # decision_waf_request is off; the filters set it again per route.
        decision_waf_request_set $decision_waf_request_id $upstream_http_x_decision_waf_request_id;

        # Drop any X-Decision-Waf-Request-Id an upstream app sends, so only the
        # module-set value above reaches clients.
        proxy_hide_header X-Decision-Waf-Request-Id;

        # At server level, once: a location-level add_header would drop the
        # server-level ones. Empty (so not sent) where decision-waf is not attached.
        add_header X-Decision-Waf-Request-Id $decision_waf_request_id always;
