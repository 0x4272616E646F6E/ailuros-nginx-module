name: ngf-watch

on:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Opens a PR; it never merges one. Merging (and so adding a supported NGF)
  # is a human decision after CI has run on the PR.
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the ngf-watch/* branch
      pull-requests: write # open the PR
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve new NGF releases (read-only) and verify the NGINX source
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ runner.temp }}/ngf-watch-notes.md
        run: |
          added=$(scripts/ngf-watch.sh)
          if [ -z "$added" ]; then
            echo "versions.json is current"
            exit 0
          fi
          {
            echo "versions=$(printf '%s' "$added" | paste -sd, -)"
            echo "changed=true"
          } >> "$GITHUB_OUTPUT"
          git --no-pager diff versions.json
      - name: Open the pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSIONS: ${{ steps.update.outputs.versions }}
          NOTES_FILE: ${{ runner.temp }}/ngf-watch-notes.md
          BODY_FILE: ${{ runner.temp }}/ngf-watch-body.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="ngf-watch/ngf-$(printf '%s' "$VERSIONS" | tr ',' '-')"
          title="Support NGF $(printf '%s' "$VERSIONS" | sed 's/,/, /g')"
          if [ -n "$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "a PR for $branch is already open"
            exit 0
          fi
          {
            echo "Adds the NGF release(s) below to \`versions.json\` (newest three kept; older rows drop out)."
            echo
            cat "$NOTES_FILE"
            echo
            echo "The NGINX version comes from \`nginx -V\` in the stock data plane image. The NGINX source tarball was checked to be that version and verified against the pinned nginx.org signing keys in \`.github/nginx-keys/\`."
            echo
            echo "**CI has not run on this PR.** A PR opened by a workflow with the built-in token does not trigger workflows. Start it by running the \`ci\` workflow on branch \`$branch\` (Actions, ci, Run workflow), or by closing and reopening this PR. CI (and the kind workflow) must pass before this is merged."
            echo
            echo "Also before merging: check that the nginx container is still \`containers/0\` in NGF's pod template, and update the README table and \`deploy/ngf/\` for the new version. This PR is never merged automatically."
            echo
            echo "Opened by $RUN_URL"
          } > "$BODY_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git switch -c "$branch"
          git add versions.json
          git commit -m "$title"
          # A leftover branch from an earlier closed PR is replaced, not a blocker.
          # The lease names the SHA seen now (empty: the branch must not exist).
          remote_sha=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          git push --force-with-lease="$branch:$remote_sha" origin "$branch"
          gh pr create --repo "$REPO" --head "$branch" --base main --title "$title" --body-file "$BODY_FILE"
