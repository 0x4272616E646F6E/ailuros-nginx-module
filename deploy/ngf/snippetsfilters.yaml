# Per-route filters. List one in an HTTPRoute rule:
#   filters:
#     - type: ExtensionRef
#       extensionRef: {group: gateway.nginx.org, kind: SnippetsFilter, name: decision-waf-check}
# They are in the location context on purpose; see README.md before using
# decision_waf_request at server level.
apiVersion: gateway.nginx.org/v1alpha1
kind: SnippetsFilter
metadata:
  name: decision-waf-check
  namespace: default
spec:
  snippets:
    - context: http.server.location
      value: |
        decision_waf_request /_decision_waf;
        decision_waf_request_set $decision_waf_request_id $upstream_http_x_decision_waf_request_id;
---
# Fail open: if decision-waf gives no decision (unreachable, timeout, 5xx other
# than its own 503), the request continues and a warning is logged.
apiVersion: gateway.nginx.org/v1alpha1
kind: SnippetsFilter
metadata:
  name: decision-waf-check-open
  namespace: default
spec:
  snippets:
    - context: http.server.location
      value: |
        decision_waf_request /_decision_waf;
        decision_waf_request_set $decision_waf_request_id $upstream_http_x_decision_waf_request_id;
        decision_waf_request_unavailable open;
